<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportyBet Financial Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header & Data Management -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400">SportyBet Tracker</h1>
                <p class="text-slate-400 text-sm">Mfumo wa Offline (Local Storage)</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportData()" class="bg-blue-600 hover:bg-blue-500 text-xs md:text-sm px-3 py-2 rounded font-semibold transition">📥 Backup Data</button>
                <label class="bg-purple-600 hover:bg-purple-500 text-xs md:text-sm px-3 py-2 rounded font-semibold cursor-pointer transition">
                    📤 Restore Data
                    <input type="file" id="importFile" onchange="importData(event)" class="hidden" accept=".json">
                </label>
                <button onclick="exportPDF()" class="bg-red-600 hover:bg-red-500 text-xs md:text-sm px-3 py-2 rounded font-semibold transition">📄 Export PDF</button>
            </div>
        </div>

        <!-- Dashboard Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="pdfContent">
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                <p class="text-slate-400 text-xs uppercase">Jumla ya Mtaji</p>
                <h3 class="text-xl font-bold text-white mt-1" id="totalStaked">TZS 0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                <p class="text-slate-400 text-xs uppercase">Jumla ya Mapato</p>
                <h3 class="text-xl font-bold text-white mt-1" id="totalReturned">TZS 0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                <p class="text-slate-400 text-xs uppercase">Faida / Hasara</p>
                <h3 class="text-xl font-bold mt-1" id="netProfit">TZS 0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-lg border border-slate-700">
                <p class="text-slate-400 text-xs uppercase">ROI (%)</p>
                <h3 class="text-xl font-bold text-amber-400 mt-1" id="roiVal">0%</h3>
            </div>
        </div>

        <!-- Form for New Bet -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-lg font-semibold mb-4 text-emerald-400">Sajili Bet Mpya</h2>
            <form id="betForm" onsubmit="addBet(event)" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="number" id="stake" placeholder="Mtaji (TZS)" required class="bg-slate-900 border border-slate-700 p-2.5 rounded text-white focus:outline-none focus:border-emerald-500">
                <input type="number" step="0.01" id="odds" placeholder="Odds" required class="bg-slate-900 border border-slate-700 p-2.5 rounded text-white focus:outline-none focus:border-emerald-500">
                <select id="status" class="bg-slate-900 border border-slate-700 p-2.5 rounded text-white focus:outline-none focus:border-emerald-500">
                    <option value="WON">WON (Umeshinda)</option>
                    <option value="LOST">LOST (Umekosa)</option>
                </select>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded transition">Hifadhi Bet</button>
            </form>
        </div>

        <!-- Chart Section -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-lg font-semibold mb-4 text-slate-300">Mwenendo wa kifedha</h2>
            <canvas id="financeChart" class="max-h-64"></canvas>
        </div>

        <!-- History Table -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 overflow-x-auto">
            <h2 class="text-lg font-semibold mb-4 text-slate-300">Kumbukumbu za Bets</h2>
            <table class="w-full text-left text-sm text-slate-300">
                <thead class="bg-slate-900 text-slate-400 uppercase text-xs">
                    <tr>
                        <th class="p-3">Tarehe</th>
                        <th class="p-3">Mtaji</th>
                        <th class="p-3">Odds</th>
                        <th class="p-3">Matokeo</th>
                        <th class="p-3">Faida/Hasara</th>
                        <th class="p-3">Kitendo</th>
                    </tr>
                </thead>
                <tbody id="betsTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let bets = JSON.parse(localStorage.getItem('sportybet_records')) || [];
        let chartInstance = null;

        function saveAndRefresh() {
            localStorage.setItem('sportybet_records', JSON.stringify(bets));
            renderDashboard();
        }

        function addBet(e) {
            e.preventDefault();
            const stake = parseFloat(document.getElementById('stake').value);
            const odds = parseFloat(document.getElementById('odds').value);
            const status = document.getElementById('status').value;

            const newBet = {
                id: Date.now(),
                date: new Date().toLocaleDateString('sw-TZ'),
                stake,
                odds,
                status,
                returnVal: status === 'WON' ? stake * odds : 0,
                profit: status === 'WON' ? (stake * odds) - stake : -stake
            };

            bets.unshift(newBet);
            saveAndRefresh();
            document.getElementById('betForm').reset();
        }

        function deleteBet(id) {
            bets = bets.filter(b => b.id !== id);
            saveAndRefresh();
        }

        function renderDashboard() {
            let staked = 0, returned = 0, profit = 0;
            const tableBody = document.getElementById('betsTableBody');
            tableBody.innerHTML = '';

            bets.forEach(b => {
                staked += b.stake;
                returned += b.returnVal;
                profit += b.profit;

                tableBody.innerHTML += `
                    <tr class="border-b border-slate-700 hover:bg-slate-750">
                        <td class="p-3">${b.date}</td>
                        <td class="p-3">TZS ${b.stake.toLocaleString()}</td>
                        <td class="p-3">${b.odds}</td>
                        <td class="p-3"><span class="${b.status === 'WON' ? 'text-emerald-400' : 'text-red-400'} font-bold">${b.status}</span></td>
                        <td class="p-3 font-semibold ${b.profit >= 0 ? 'text-emerald-400' : 'text-red-400'}">TZS ${b.profit.toLocaleString()}</td>
                        <td class="p-3"><button onclick="deleteBet(${b.id})" class="text-red-500 hover:text-red-400">Futa</button></td>
                    </tr>
                `;
            });

            document.getElementById('totalStaked').innerText = `TZS ${staked.toLocaleString()}`;
            document.getElementById('totalReturned').innerText = `TZS ${returned.toLocaleString()}`;
            
            const profitEl = document.getElementById('netProfit');
            profitEl.innerText = `TZS ${profit.toLocaleString()}`;
            profitEl.className = `text-xl font-bold mt-1 ${profit >= 0 ? 'text-emerald-400' : 'text-red-400'}`;

            const roi = staked > 0 ? ((profit / staked) * 100).toFixed(1) : 0;
            document.getElementById('roiVal').innerText = `${roi}%`;

            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            const labels = bets.slice(0, 10).map(b => b.date).reverse();
            const data = bets.slice(0, 10).map(b => b.profit).reverse();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Faida/Hasara (TZS)',
                        data,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }

        // Backup to JSON
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bets));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `SportyBet_Backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Restore from JSON
        function importData(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    bets = JSON.parse(e.target.result);
                    saveAndRefresh();
                    alert('Taarifa zimerudishwa kikamilifu!');
                } catch(err) {
                    alert('Faili hili sio sahihi!');
                }
            };
            reader.readAsText(event.target.files[0]);
        }

        // Export PDF
        function exportPDF() {
            const element = document.getElementById('pdfContent');
            html2pdf().from(element).save('SportyBet_Summary.pdf');
        }

        renderDashboard();
    </script>
</body>
</html>
